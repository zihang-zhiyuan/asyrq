# asyrq: Python 分布式任务队列
# 项目配置文件，定义包元数据、依赖和构建信息

[project]
name = "asyrq"
version = "0.1.0"
description = "Python 1:1 复刻 Go 语言 asynq 库的 Redis 分布式任务队列"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "asyrq contributors"}
]
keywords = ["redis", "task-queue", "asyncio", "distributed", "queue", "asynq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "redis[hiredis]>=5.0.0,<6.0.0",   # 异步 Redis 客户端，hiredis 提供更高性能的解析器
    "croniter>=2.0.0",                  # Cron 表达式解析器，用于定时任务
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",                    # 测试框架
    "pytest-asyncio>=0.23.0",           # asyncio 测试支持
    "pytest-cov>=5.0.0",                # 测试覆盖率
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asyrq*"]

[tool.setuptools.package-data]
asyrq = ["lua/*.lua", "py.typed"]

[project.urls]
Homepage = "https://github.com/zihang-zhiyuan/asyrq"
Repository = "https://github.com/zihang-zhiyuan/asyrq.git"

[tool.pytest.ini_options]
asyncio_mode = "auto"                   # 自动检测 async 测试函数
testpaths = ["tests"]
